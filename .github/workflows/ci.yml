name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge Functions
        working-directory: supabase/functions
        run: deno check */index.ts && deno test --allow-env
      - name: Launch script (production config it writes)
        run: python3 -m unittest scripts/test_launch.py
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0 # the CLI used locally; newer ones reject [inbucket] in config.toml
      - name: Database (migrations, RLS and RPC tests)
        run: supabase db start && supabase test db

  firebase:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: firebase/.nvmrc
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json
      - uses: actions/setup-java@v4 # the Firestore emulator needs Java 21+
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests (shared modules, vectors against contracts, input rules, errors against the app)
        run: npm test
      - run: npm i -g firebase-tools@15.34.2
      - name: Security Rules (Firestore and Storage emulators)
        run: npm run test:rules
      - name: Callables (full emulator suite)
        run: npm run test:int
