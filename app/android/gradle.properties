# Sized for an 8 GB Mac: the template default (-Xmx8G) makes the machine swap to a halt.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m
kotlin.daemon.jvmargs=-Xmx768m
# No daemon lingering in RAM after a build.
org.gradle.daemon=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
