# flutter_lints (recommended + Flutter rules) plus the stricter rules below. `flutter analyze` must stay clean.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - third_party/**
  language:
    strict-inference: true # no silent `dynamic` from untyped declarations and calls

linter:
  rules:
    # Never log: tokens, phone numbers and addresses must not reach logcat in any build.
    avoid_print: true
    # A forgotten await on the money/auth paths hides errors and races; mark fire-and-forget with unawaited().
    unawaited_futures: true
    # Leaks: every StreamSubscription/StreamController is cancelled/closed.
    cancel_subscriptions: true
    close_sinks: true
    # Navigating or showing a snackbar from a dead screen after an await.
    use_build_context_synchronously: true
    # Fewer rebuilds and allocations on mid-range phones.
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    # Errors that should be impossible to write.
    only_throw_errors: true
    throw_in_finally: true
    avoid_slow_async_io: true
    avoid_type_to_string: true
    no_adjacent_strings_in_list: true
    literal_only_boolean_expressions: true
    unnecessary_statements: true
    test_types_in_equals: true
    no_literal_bool_comparisons: true
    avoid_void_async: true
